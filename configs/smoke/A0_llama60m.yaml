# 60M LLaMA-shape smoke on 1×4090. Validates Coupled Muon v2 end-to-end with probes.
# Matches the QZ baseline architecture (RMSNorm + RoPE + SwiGLU, MHA, no QK-Norm).
# Uses synthetic shards by default — override with --override data.shard_dir=... for FineWeb.
name: smoke_A0_llama60m

data:
  shard_dir: data/synthetic_smoke

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: false
  mlp:
    type: swiglu
    intermediate: 1408           # ≈ 8/3 * 512 rounded to 128
  norm:
    type: rmsnorm
  pos_emb:
    type: rope

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 100_000_000
  seq_len: 2048
  local_batch_size: 4              # fits comfortably on 24 GB at 60M
  grad_accum_steps: 4              # effective batch = 16 × 2048 = 32 768 tokens
  warmup_steps: 100
  log_every_steps: 10
  eval_every_steps: 200
  val_tokens: 500_000
  probes:
    svd_interval_tokens: 20_000_000
    coupled_pair_interval_tokens: 20_000_000
    attn_logit_interval_tokens: 2_000_000
    pair_factor_ratio_interval_tokens: 0

run:
  wandb: false
