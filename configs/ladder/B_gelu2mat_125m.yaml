# Ladder rung B — A1 with SwiGLU → GELU 2-matrix MLP (delete the gate).
# Tests whether coupling still helps when (down, up) is the EXACT MLP composition.
# If the coupled gap drops B vs A1 → gate-ignoring is the issue → triple-coupling
# becomes the highest-priority next algorithmic change (per experiment.md d.2).
name: ladder_B_gelu2mat_125m

model:
  hidden: 768
  n_layers: 12
  attn:
    n_heads: 12
    qk_norm: false
  mlp:
    type: gelu_2mat
    intermediate: 3072             # 4 * 768 (GELU 2-mat default)
  norm:
    type: rmsnorm
  pos_emb:
    type: rope

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 2_500_000_000
  seq_len: 2048
  local_batch_size: 16
  grad_accum_steps: 8              # 2× of original (4-GPU value was 4); doubled for 2× H200 to keep ~0.5M global batch
  warmup_steps: 300
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 200_000_000
    coupled_pair_interval_tokens: 200_000_000
    attn_logit_interval_tokens: 20_000_000
