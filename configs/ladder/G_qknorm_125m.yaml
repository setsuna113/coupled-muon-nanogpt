# Ladder rung G — A1 with QK-Norm ON. Isolates the QK-Norm × Q-K coupling
# interaction. Per experiment.md b.2 / d.2: QK-Norm normalises Q and K
# row-wise *before* attention, partially invalidating the Q-K coupling
# assumption that the gradient should orthogonalise W_Q W_K^T. Strong reason
# to *expect* less coupled-Muon benefit on QK-Norm-equipped architectures.
# If G loses the coupled gap relative to A1 → Q-K coupling and QK-Norm do
# the same job; QK-Norm is the production fix (MuonClip/Kimi-K2), so prefer it.
name: ladder_G_qknorm_125m

model:
  hidden: 768
  n_layers: 12
  attn:
    n_heads: 12
    qk_norm: true
  mlp:
    type: swiglu
    intermediate: 2048
  norm:
    type: rmsnorm
  pos_emb:
    type: rope

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 2_500_000_000
  seq_len: 2048
  local_batch_size: 16
  grad_accum_steps: 8              # 2× of original (4-GPU value was 4); doubled for 2× H200 to keep ~0.5M global batch
  warmup_steps: 300
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 200_000_000
    coupled_pair_interval_tokens: 200_000_000
    attn_logit_interval_tokens: 20_000_000
