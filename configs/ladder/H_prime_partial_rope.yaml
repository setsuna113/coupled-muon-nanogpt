# Ladder rung H' — partial-RoPE (0.5) variant of H. Added for Phase 2.1 Phase B
# (experiment.md d.7.8) so the qk_coupling.partial_rope_policy sweep can target
# a real partial-RoPE architecture. Identical to H_modded_dense in every other
# respect — flipping rope_partial_frac=0.5 is the ONE axis under test.
#
# Under partial RoPE the Q-K branch's 2-D rotation-pair reshape only applies to
# the first 50% of head_dim (the rotated channels). The non-RoPE tail goes to
# the Phase-2.1 `partial_rope_policy` dispatch in `coupled_muon.py`.
name: ladder_H_prime_partial_rope

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: true
    rope_partial_frac: 0.5            # partial-RoPE (vs H which is 1.0)
  mlp:
    type: relu2
    intermediate: 2048
  norm:
    type: rmsnorm
  pos_emb:
    type: rope

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 2_500_000_000
  seq_len: 2048
  local_batch_size: 16
  grad_accum_steps: 8                # global batch ≈ 0.5M tokens
  warmup_steps: 300
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 200_000_000
    coupled_pair_interval_tokens: 200_000_000
    attn_logit_interval_tokens: 20_000_000
