# Ladder rung C — B with RoPE → learned positional embeddings.
# 60M Common-Size (hidden=512, n_layers=8, n_heads=8) — same shape as A0.
# Per experiment.md d.2: C continues from B (GELU 2-mat MLP) with the only
# *new* change being pos_emb. Tests whether Q-K coupling effect survives
# without RoPE block reshape. With learned-pos there is no 2-D rotation
# block structure for Q-K, so the optimizer factory disables `use_multi_head`
# entirely (the V-O multi-head reshape isn't RoPE-dependent but the QK one is;
# the simplest correctness move is to disable both — see factory.py guard).
name: ladder_C_learnedpos

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: false
  mlp:
    type: gelu_2mat               # continues from B
    intermediate: 2048            # 4 × 512, GELU-2mat default
  norm:
    type: rmsnorm
  pos_emb:
    type: learned

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 2_500_000_000
  seq_len: 2048
  local_batch_size: 16
  grad_accum_steps: 8              # global batch ≈ 0.5M tokens (world_size 2 × local_batch 16 × seq_len 2048 × 8)
  warmup_steps: 300
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 200_000_000
    coupled_pair_interval_tokens: 200_000_000
    attn_logit_interval_tokens: 20_000_000
