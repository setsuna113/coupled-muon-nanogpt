# Stretch rung Z_350m_dense — 350M dense for the size-axis validation
# (experiment.md d.5 §329 commissioned recipe, now formally part of Phase 2).
# hidden=1024, n_layers=18 ⇒ ~350M total. SwiGLU intermediate=2816 (8/3*1024
# rounded to 128). Full RoPE, RMSNorm, no QK-Norm. 7B tokens (~20× Chinchilla
# for 350M). Same global batch as 60M-CS (0.5M tokens). ~9 h/seed on R_prod.
name: ladder_Z_350m_dense

model:
  hidden: 1024
  n_layers: 18
  attn:
    n_heads: 16
    qk_norm: false
  mlp:
    type: swiglu
    intermediate: 2816
  norm:
    type: rmsnorm
  pos_emb:
    type: rope

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 7_000_000_000
  seq_len: 2048
  local_batch_size: 8
  grad_accum_steps: 16             # global batch ≈ 0.5M tokens
  warmup_steps: 1000
  log_every_steps: 50
  eval_every_steps: 2000
  val_tokens: 10_000_000
  probes:
    svd_interval_tokens: 1_000_000_000
    coupled_pair_interval_tokens: 1_000_000_000
    attn_logit_interval_tokens: 100_000_000
    pair_factor_ratio_interval_tokens: 500_000_000
