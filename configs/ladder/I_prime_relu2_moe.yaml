# Ladder rung I' — H with MoE (every-other-layer, 8 experts top-2), but
# experts inherit ReLU² 2-mat from H. 60M Common-Size dense backbone
# (hidden=512, n_layers=8, n_heads=8) — same shape as A0/H. This is the FIRST
# MoE rung in the ladder under the I' → I refactoring (experiment.md d.2):
#   H  → I'  : MoE introduction alone (single axis: dense → MoE), with
#              activation held fixed at ReLU². Tests whether MoE-introduction
#              by itself kills the coupled-vs-Muon gap.
#   I' → I   : SwiGLU experts on the same MoE topology. Tests the gate-
#              omission-under-routing hypothesis (c.2). If gap survives at I'
#              but dies at I, the gate-omission story is confirmed.
#
# Per experiment.md a.3/b.2: ReLU² 2-mat has no learnable gate, so coupled
# (down, up) captures the entire learnable composition (modulo activation
# Jacobian). This rung is "MoE without the gate complication".
#
# Per-expert ReLU² 2-mat at I_expert = 4·hidden = 2048 (matches dense FF), so
# E·I_expert = 8·2048 = 16384, slightly larger total expert capacity than the
# SwiGLU-MoE rungs at 11264 (a consequence of the activation choice, not a
# spec violation).
name: ladder_I_prime_relu2_moe

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: true                 # modded-style baseline (carried from H)
  mlp:
    type: relu2                   # carried from H
    intermediate: 2048            # 4 × 512, ReLU²-2mat default (carried from H)
  norm:
    type: rmsnorm
  pos_emb:
    type: rope
  moe:
    enabled: true
    num_experts: 8                # same topology as I/J/K/M/N
    top_k: 2
    capacity_factor: 1.25
    aux_loss_coef: 0.01
    z_loss_coef: 1.0e-3
    balancing_type: aux_loss
    # `intermediate: 0` ⇒ inherit `mlp.intermediate` (2048), so per-expert ff
    # matches the dense ReLU² MLP — same active-parameter recipe as I.

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true
  couple_router_to_muon: true   # default; matches Moonlight 2502.16982 §2.2.

train:
  total_tokens: 5_000_000_000
  seq_len: 2048
  local_batch_size: 8
  grad_accum_steps: 16              # global batch ≈ 0.5M tokens (MoE: world_size 2 × local_batch 8 × seq_len 2048 × 16)
  warmup_steps: 500
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 500_000_000
    coupled_pair_interval_tokens: 500_000_000
    attn_logit_interval_tokens: 50_000_000
    moe_load_interval_tokens: 50_000_000
