# Ladder rung G — A0 with QK-Norm ON. Isolates the QK-Norm × Q-K coupling
# interaction. 60M Common-Size (hidden=512, n_layers=8, n_heads=8) — same shape as A0.
# Per experiment.md b.2 / d.2: QK-Norm normalises Q and K row-wise *before*
# attention, partially invalidating the Q-K coupling assumption that the
# gradient should orthogonalise W_Q W_K^T. Strong reason to *expect* less
# coupled-Muon benefit on QK-Norm-equipped architectures.
# If G loses the coupled gap relative to A0 → Q-K coupling and QK-Norm do
# the same job; QK-Norm is the production fix (MuonClip/Kimi-K2), so prefer it.
name: ladder_G_qknorm

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: true
  mlp:
    type: swiglu
    intermediate: 1408             # 8/3 * 512 rounded to 128 (matches A0)
  norm:
    type: rmsnorm
  pos_emb:
    type: rope

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 2_500_000_000
  seq_len: 2048
  local_batch_size: 16
  grad_accum_steps: 8              # global batch ≈ 0.5M tokens (world_size 2 × local_batch 16 × seq_len 2048 × 8)
  warmup_steps: 300
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 200_000_000
    coupled_pair_interval_tokens: 200_000_000
    attn_logit_interval_tokens: 20_000_000
