# Ladder rung N — 4 experts, top-2; per-expert intermediate doubled (2816).
# 60M Common-Size dense backbone (hidden=512, n_layers=8, n_heads=8) — same
# shape as I; only `num_experts` and per-expert `intermediate` change.
# Stress test for the OPPOSITE regime: per-expert intermediate ≈ 2× dense MLP.
# Per experiment.md c.1: this is closer to Moonlight's "large matrix" regime
# where coupled effects should be more pronounced (less noise floor).
# Useful as a control: if rung M shows coupled gap drops vs rung N, the failure
# is per-expert SNR (small-matrix regime).
name: ladder_N_4experts

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: true
  mlp:
    type: swiglu
    intermediate: 1408            # dense MLP same as I (controlled comparison)
  norm:
    type: rmsnorm
  pos_emb:
    type: rope
  moe:
    enabled: true
    num_experts: 4
    top_k: 2
    capacity_factor: 1.25
    aux_loss_coef: 0.01
    z_loss_coef: 1.0e-3
    balancing_type: aux_loss
    intermediate: 2816            # per-expert intermediate doubled vs I (1408).
                                  # E×ff stays constant (4×2816 = 8×1408 = 11264),
                                  # pushing into the large-matrix regime.

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true
  couple_router_to_muon: true   # default; rung N varies *expert count*, not router.

train:
  total_tokens: 5_000_000_000
  seq_len: 2048
  local_batch_size: 8
  grad_accum_steps: 16              # global batch ≈ 0.5M tokens (MoE: world_size 2 × local_batch 8 × seq_len 2048 × 16)
  warmup_steps: 500
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 500_000_000
    coupled_pair_interval_tokens: 500_000_000
    attn_logit_interval_tokens: 50_000_000
    moe_load_interval_tokens: 50_000_000
