# Ladder rung I — first MoE rung. Every-other-layer MoE (per d.2) with 8-expert
# top-2 routing. Measured: 322M total / 283M non-embed (spec d.5 target was
# 500M total / 125M active — actual is ~half because every-other replacement
# is genuinely sparser than naive every-block, and our dense MLP intermediate
# stays at the 125M-class size). I/J/K/M/N keep the same dense MLP and same
# total MoE capacity (E×ff_per_expert constant) for a controlled comparison.
# Router under AdamW (per experiment.md c.3); aux-loss balancing for first cut.
name: ladder_I_moe

model:
  hidden: 768
  n_layers: 12
  attn:
    n_heads: 12
    qk_norm: true                   # modded-style baseline
  mlp:
    type: swiglu
    intermediate: 2048
  norm:
    type: rmsnorm
  pos_emb:
    type: rope
  moe:
    enabled: true
    num_experts: 8
    top_k: 2
    capacity_factor: 1.25
    aux_loss_coef: 0.01
    z_loss_coef: 1.0e-3
    balancing_type: aux_loss

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true
  couple_router_to_muon: true   # default; matches Moonlight 2502.16982 §2.2.
                                # Rung J flips this to false (AdamW-router ablation).

train:
  total_tokens: 5_000_000_000
  seq_len: 2048
  local_batch_size: 8                # MoE has higher activation memory
  grad_accum_steps: 16              # 2× of original (4-GPU value was 8); doubled for 2× H200 to keep ~0.5M global batch
  warmup_steps: 500
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 500_000_000
    coupled_pair_interval_tokens: 500_000_000
    attn_logit_interval_tokens: 50_000_000
    moe_load_interval_tokens: 50_000_000
