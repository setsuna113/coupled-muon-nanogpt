# Ladder rung I — first MoE rung. Modded-style dense block but every other MLP
# is replaced with sparse 8-expert top-2. ~500M total / ~125M active.
# Router under AdamW (per experiment.md c.3); aux-loss balancing for first cut.
name: ladder_I_moe_500m

model:
  hidden: 768
  n_layers: 12
  attn:
    n_heads: 12
    qk_norm: true                   # modded-style baseline
  mlp:
    type: swiglu
    intermediate: 2048
  norm:
    type: rmsnorm
  pos_emb:
    type: rope
  moe:
    enabled: true
    num_experts: 8
    top_k: 2
    capacity_factor: 1.25
    aux_loss_coef: 0.01
    z_loss_coef: 1.0e-3
    balancing_type: aux_loss

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true
  # Routers go to AdamW automatically via the factory's "router" filter.

train:
  total_tokens: 5_000_000_000
  seq_len: 2048
  local_batch_size: 8                # MoE has higher activation memory
  grad_accum_steps: 8
  warmup_steps: 500
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 500_000_000
    coupled_pair_interval_tokens: 500_000_000
    attn_logit_interval_tokens: 50_000_000

run:
  wandb: true
