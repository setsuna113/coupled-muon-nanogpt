# Ladder rung I — first SwiGLU MoE rung. Every-other-layer MoE (per d.2) with
# 8-expert top-2 routing. 60M Common-Size dense backbone (hidden=512, n_layers=8,
# n_heads=8) — same shape as A0/H. Per-expert SwiGLU at I_expert = 1408 (matches
# the dense FF, so E·I_expert = 11264 = 8/3·hidden).
# I/J/K/M/N keep the same dense MLP and the same total MoE capacity
# (E×ff_per_expert = 11264) for a controlled comparison; only num_experts and
# per-expert width change across the trio.
# Router under Muon (per experiment.md c.3); aux-loss balancing for first cut.
name: ladder_I_moe

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: true                   # modded-style baseline
  mlp:
    type: swiglu
    intermediate: 1408              # 8/3 * 512 rounded to 128 (matches A0)
  norm:
    type: rmsnorm
  pos_emb:
    type: rope
  moe:
    enabled: true
    num_experts: 8
    top_k: 2
    capacity_factor: 1.25
    aux_loss_coef: 0.01
    z_loss_coef: 1.0e-3
    balancing_type: aux_loss
    # `intermediate: 0` (default) ⇒ inherit `mlp.intermediate` (1408), so
    # per-expert ff matches the dense MLP and E·I_expert = 8·1408 = 11264.

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true
  couple_router_to_muon: true   # default; matches Moonlight 2502.16982 §2.2.
                                # Rung J flips this to false (AdamW-router ablation).

train:
  total_tokens: 5_000_000_000
  seq_len: 2048
  local_batch_size: 8                # MoE has higher activation memory
  grad_accum_steps: 16              # global batch ≈ 0.5M tokens (MoE: world_size 2 × local_batch 8 × seq_len 2048 × 16)
  warmup_steps: 500
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 500_000_000
    coupled_pair_interval_tokens: 500_000_000
    attn_logit_interval_tokens: 50_000_000
    moe_load_interval_tokens: 50_000_000
