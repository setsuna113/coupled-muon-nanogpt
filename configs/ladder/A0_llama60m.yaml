# Ladder rung A0 — 60M LLaMA-shape, production scale on 4×H200.
# Reproduces (re-runs) the dense LLaMA-60M result. ~30 min/seed at 1.2B tokens.
name: ladder_A0_llama60m

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: false
  mlp:
    type: swiglu
    intermediate: 1408
  norm:
    type: rmsnorm
  pos_emb:
    type: rope

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 1_200_000_000      # ≈ 20× Chinchilla for 60M
  seq_len: 2048
  local_batch_size: 16             # per H200, with grad-accum to hit 0.5M tokens/step
  grad_accum_steps: 4              # global = 16 × 2048 × 4 GPUs × 4 accum ≈ 0.524M
  warmup_steps: 200
  log_every_steps: 25
  eval_every_steps: 500
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 100_000_000
    coupled_pair_interval_tokens: 100_000_000
    attn_logit_interval_tokens: 10_000_000

run:
  wandb: true
