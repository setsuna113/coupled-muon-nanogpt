# Ladder rung E — vanilla Karpathy nanoGPT shape: GELU 2-mat MLP, LayerNorm,
# learned positional embeddings, no QK-Norm. Pure GPT-2 architecture at 60M-CS.
# 60M Common-Size (hidden=512, n_layers=8, n_heads=8) — same shape as A0.
# Reference rung: dense NanoGPT with no LLaMA-isms. Per experiment.md d.2:
# if E loses the coupled gap but C and D don't, the Karpathy-style
# (LN+bias+learned-pos+GELU) interaction with coupling is the killer; pursue
# via D and C diagnostics first.
name: ladder_E_karpathy

model:
  hidden: 512
  n_layers: 8
  attn:
    n_heads: 8
    qk_norm: false
  mlp:
    type: gelu_2mat
    intermediate: 2048             # 4 * 512 (Karpathy default)
  norm:
    type: layernorm
  pos_emb:
    type: learned

optimizer:
  type: coupled_muon_v2
  lr: 3.0e-3
  coupled_steps: 4
  ns_steps: 5
  use_multi_head: true

train:
  total_tokens: 2_500_000_000
  seq_len: 2048
  local_batch_size: 16
  grad_accum_steps: 8              # global batch ≈ 0.5M tokens (world_size 2 × local_batch 16 × seq_len 2048 × 8)
  warmup_steps: 300
  log_every_steps: 25
  eval_every_steps: 1000
  val_tokens: 5_000_000
  probes:
    svd_interval_tokens: 200_000_000
    coupled_pair_interval_tokens: 200_000_000
    attn_logit_interval_tokens: 20_000_000
