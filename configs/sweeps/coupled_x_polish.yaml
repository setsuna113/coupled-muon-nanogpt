# Joint ablation: coupled_steps × final_polish. Fills the gap that the two
# single-axis ablations (coupled_steps_ablation.yaml, final_polish_ablation.yaml)
# leave open — namely, "does the conclusion at coupled_steps=4 generalize to
# other coupled_steps values?"
#
# experiment.md a.2.1 explicitly frames this as an empirical question: "Whether
# stage 2 is doing meaningful work or is approximately a no-op (because
# stage-1's output happens to be near-orthogonal at the operating point) is an
# *empirical* question we resolve via the `final_polish` ablation". The d.4
# table only varies one axis at a time; this YAML adds the joint cell.
#
# Cells: (coupled_steps × final_polish) = (5 × 2) = 10. With seeds × LR=fixed,
# 30 runs total at A1 (125M dense). The coupled_steps=0 cell is technically
# degenerate w.r.t. final_polish (no stage 1 to skip; both branches collapse
# to plain Muon) but we keep both values for symmetry — they should produce
# identical loss curves and serve as a numerical-equality check.
base: configs/ladder/A1_llama125m.yaml
grid:
  optimizer.coupled_steps: [0, 1, 2, 4, 8]
  optimizer.final_polish: [false, true]
  seed: [0, 1, 2]
fixed:
  optimizer.type: coupled_muon_v2
  optimizer.lr: 3.0e-3
  optimizer.ns_steps: 5
  run.wandb_project: coupled-muon-ablation
  # Group on the joint (coupled_steps, final_polish) so each of the 10 cells
  # gets its own wandb group with 3 seeds auto-aggregated.
  run.wandb_group: "${name}/cs${optimizer.coupled_steps}_polish${optimizer.final_polish}"
  train.probes.ns_internal_interval_tokens: 200_000_000
