# Phase-2.1 B2-partial-RoPE — 5-seed confirmation of the partial_rope_policy
# winner on rung H' (best-LR from B1). 5 cells = 1 rung × 5 seeds.
#
# BEFORE LAUNCH: from Phase-B1 W&B readout, set:
#   - optimizer.qk_coupling.partial_rope_policy = <B1 H' winner>
#   - optimizer.lr = <B1 H' best LR for the winner>
# via `--override` at dispatch time.
#
# Lives on R_screen (8×H100, 4-way parallel), ~1.3 h/cell, ~0.07 R_screen days.
base: configs/ladder/H_prime_partial_rope.yaml
grid:
  seed: [0, 1, 2, 3, 4]
fixed:
  optimizer.type: coupled_muon_v2
  optimizer.coupled_steps: 4
  optimizer.ns_steps: 5
  optimizer.ns_coefficients: bernstein
  optimizer.qk_coupling.full_rope: legacy_rope2d
  optimizer.qk_coupling.no_rope_policy: current_flat2d_fallback
  optimizer.qk_coupling.partial_rope_policy: current_flat2d_fallback
  # ^ override at launch with the B1 H' winner
  optimizer.lr: 1.0e-2
  # ^ override at launch with B1 H' best LR for the winner
  optimizer.use_multi_head: true
  optimizer.couple_qk: true
  optimizer.couple_vo: true
  optimizer.couple_updown: true
  run.wandb_project: coupled-muon-qk-policy-confirm
  run.wandb_group: "${name}/phase2.1_b2_partial_rope_confirm"
