# Phase-2.1 B2-no-RoPE — 5-seed confirmation of the no_rope_policy winner
# on rungs C and D (best-LR per rung from B1). 10 cells = 2 rungs × 5 seeds.
#
# BEFORE LAUNCH: from Phase-B1 W&B readout, set:
#   - optimizer.qk_coupling.no_rope_policy = <B1 winner>
#   - optimizer.lr (per rung) = <B1 best LR for the winner>
# via `--override` at dispatch time. Defaults below are placeholders so the
# YAML is syntactically valid (current_flat2d_fallback @ lr=3e-3).
#
# Lives on R_screen (8×H100, 4-way parallel), ~1.3 h/cell, ~0.14 R_screen days.
bases:
  - configs/ladder/C_learnedpos.yaml
  - configs/ladder/D_layernorm.yaml
grid:
  seed: [0, 1, 2, 3, 4]
fixed:
  optimizer.type: coupled_muon_v2
  optimizer.coupled_steps: 4
  optimizer.ns_steps: 5
  optimizer.ns_coefficients: bernstein
  optimizer.qk_coupling.full_rope: legacy_rope2d
  optimizer.qk_coupling.no_rope_policy: current_flat2d_fallback
  # ^ override at launch with the B1 winner
  optimizer.qk_coupling.partial_rope_policy: current_flat2d_fallback
  optimizer.lr: 3.0e-3
  # ^ override at launch with the B1 best LR per rung
  optimizer.use_multi_head: true
  optimizer.couple_qk: true
  optimizer.couple_vo: true
  optimizer.couple_updown: true
  run.wandb_project: coupled-muon-qk-policy-confirm
  run.wandb_group: "${name}/phase2.1_b2_no_rope_confirm"
