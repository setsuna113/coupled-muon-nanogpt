# d.3 telescoping LR sweep — AdamW baseline across dense rungs B, C, D, E,
# G, H (60M-CS Common-Size; A1 dropped after the size collapse). Per Essential
# AI 2505.02222: AdamW LRs {3e-5, 1e-4, 3e-4, 1e-3, 3e-3}. Run alongside
# lr_grid_dense_muon.yaml; aggregate with bootstrap_median_ci to compute the
# coupled-vs-Muon vs AdamW reference gap.
bases:
  - configs/ladder/B_gelu2mat.yaml
  - configs/ladder/C_learnedpos.yaml
  - configs/ladder/D_layernorm.yaml
  - configs/ladder/E_karpathy.yaml
  - configs/ladder/G_qknorm.yaml
  - configs/ladder/H_modded_dense.yaml
grid:
  optimizer.type: [adamw]
  optimizer.lr: [3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
  seed: [0, 1, 2]
fixed:
  run.wandb_project: coupled-muon-ladder
