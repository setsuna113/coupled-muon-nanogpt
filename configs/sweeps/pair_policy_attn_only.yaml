# Phase-2 Tier A1 (1/3) — Pair-selection at production rung I.
# Couple attention pairs (Q-K, V-O) only; FFN up-down OFF (sent to plain Muon).
# Tests whether the LLaMA-60M coupled gain is attention-side at production
# scale and whether dropping FFN-pair coupling saves wall-clock without
# regressing loss (suggestion.md A1 / §196). Split into three separate sweep
# YAMLs (vs one with `grid` over booleans) so the policy triple is forced —
# avoids `expand.py` emitting the disallowed Cartesian product.
#
# 5 cells = 1 policy × 5 seeds. Concatenate with the FFN-only and all
# variants for the full 15-cell A1 ablation (~1.9 rig-days on R_prod).
base: configs/ladder/I_moe.yaml
grid:
  seed: [0, 1, 2, 3, 4]
fixed:
  optimizer.type: coupled_muon_v2
  optimizer.lr: 1.0e-2
  optimizer.coupled_steps: 4
  optimizer.ns_steps: 5
  optimizer.ns_coefficients: bernstein
  optimizer.couple_qk: true
  optimizer.couple_vo: true
  optimizer.couple_updown: false
  run.wandb_project: coupled-muon-pair-policy
  run.wandb_group: "${name}/policy_attn_only"
