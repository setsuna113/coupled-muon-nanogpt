# Phase-2 Tier S1 — Newton-Schulz coefficient policy sweep at A0 (60M-CS dense).
# Defends every CoupledMuon-vs-Muon delta against the "did a better NS policy
# close the gap?" attack (suggestion.md §1.3 / S1).
#
# 36 cells = 2 optimizers × 3 policies × 3 K values × 2 seeds. The
# `optimizer.coupled_steps` and `optimizer.ns_steps` axes are **tied** so
# both walk the same K-axis in lockstep (plain-Muon's `coupled_steps` is
# inert but kept aligned for symmetry); `tie:` enforces this at expand
# time. The raw Cartesian product without the tie would yield 108 cells.
#
# Lives on R_abl (2×H200), ~1 h/cell, ~1.5 rig-days.
base: configs/ladder/A0_llama60m.yaml
tie:
  - [optimizer.coupled_steps, optimizer.ns_steps]
grid:
  optimizer.type: [muon, coupled_muon_v2]
  optimizer.ns_coefficients: [bernstein, polar_express, cesista]
  optimizer.coupled_steps: [3, 5, 8]
  optimizer.ns_steps:      [3, 5, 8]
  seed: [0, 1]
fixed:
  optimizer.lr: 3.0e-3
  optimizer.ns_gram_form: false
  run.wandb_project: coupled-muon-ns-policy
  run.wandb_group: "${name}/opt${optimizer.type}_pol${optimizer.ns_coefficients}_k${optimizer.coupled_steps}"
