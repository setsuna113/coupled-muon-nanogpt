# Phase-2.1 A3 — minimal K-curve at A0. Supersedes the full
# k_curve_at_winner.yaml ({1, 2, 3, 5, 8, 12}). User decision: only
# `coupled_steps ∈ {1, 2, 4}` is needed to decide runtime/default
# (existing ablation shows K=1/2 already recovers most of the gain,
# K=4/8 plateau). Choosing K=2 vs K=4 as the v2.1 default is the
# outcome.
#
# 9 cells = 3 K values × 3 seeds. CoupledMuon only. Lives on R_abl
# (2×H200), ~1.3 h/cell, ~0.49 R_abl days.
base: configs/ladder/A0_llama60m.yaml
grid:
  optimizer.coupled_steps: [1, 2, 4]
  seed: [0, 1, 2]
fixed:
  optimizer.type: coupled_muon_v2
  optimizer.lr: 3.0e-3
  optimizer.ns_steps: 5
  optimizer.ns_coefficients: bernstein
  run.wandb_project: coupled-muon-k-curve
  run.wandb_group: "${name}/phase2.1_a3_A0_K${optimizer.coupled_steps}"
