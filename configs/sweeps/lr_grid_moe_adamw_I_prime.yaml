# Stage 3 — AdamW anchor on rung I' (gate-omission control).
# Companion to lr_grid_moe_adamw_I.yaml: closes the cross-optimizer symmetry
# across the c.2 gate-omission test. Without this anchor, the I-vs-I' comparison
# is Muon-family-only-paired; with it, both rungs have an (adamw, muon, coupled)
# triple so we can read off the gate-omission story relative to an AdamW
# reference at each rung independently.
#
# 15 cells = 1 rung × 1 opt × 5 LRs × 3 seeds.
# Same AdamW grid as lr_grid_moe_adamw_I.yaml (full 5 LRs because AdamW base
# LR differs from Muon by ~50× and we have no prior MoE-scale AdamW result to
# recenter). 3 seeds = screening floor; sufficient for a calibration anchor.
#
# Designed for the spare 2×H200 rig: 15 cells × 4.55h / (1 cell × 2 GPU) =
# 68.25h = 2.84d wall-clock. Completes well within the 7.5-d main-result deadline.
bases:
  - configs/ladder/I_prime_relu2_moe.yaml
grid:
  optimizer.type: [adamw]
  optimizer.lr: [3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
  seed: [0, 1, 2]
fixed:
  run.wandb_project: coupled-muon-moe-anchor-adamw-Iprime
