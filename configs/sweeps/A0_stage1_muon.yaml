# status: archive-stage1 — kept on disk for reproduction reference; not in active dispatch.
# Stage 1 reproduction (experiment.md): A0 LLaMA-60M-class baseline with the
# Muon family. 5 seeds × 5 LRs × 2 optimizers = 50 runs.
#
# Decision gate per experiment.md Stage 1: coupled-muon-vs-muon gap must be
# real and ≥ 3× the seed-to-seed std. Bootstrap median CI via the
# analysis/bootstrap module.
#
# LR grid per d.3 + Essential AI 2505.02222: Muon-family LRs span 1e-3..1e-1
# (5 points). AdamW LRs differ by ~50× and live in A0_stage1_adamw.yaml so
# a single grid doesn't waste cells.
#
# Cost: ~1 h/seed/cell on 2×H200 × 50 cells = ~50 wall-clock hours sequential
# (~100 GPU-h). Add A0_stage1_adamw.yaml's 25 runs for the full Stage 1.
base: configs/ladder/A0_llama60m.yaml
grid:
  optimizer.type: [muon, coupled_muon_v2]
  optimizer.lr: [1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1]
  seed: [0, 1, 2, 3, 4]
fixed:
  run.wandb_project: coupled-muon-A0-repro
