# Shared defaults. Every ladder/smoke config inherits and overrides.
# Keep this file flat enough that overriding via dotpath stays readable.

name: base

run:
  output_dir: results
  wandb: true                    # default ON for ladder/sweeps; smoke configs override.
  wandb_project: coupled-muon-nanogpt
  wandb_group: null              # null ⇒ fallback formula `${name}/${optimizer.type}/lr${optimizer.lr}`.
                                 # Sweep YAMLs use OmegaConf ${...} interpolation to override
                                 # (e.g. pair_ablation needs the couple_* flags in the group).
  wandb_mode: null               # null ⇒ honor WANDB_MODE env var, else online. Set to
                                 # "offline" in offline-only environments; sync post-hoc with
                                 # `wandb sync results/<rid>/wandb/`.
  wandb_tags: []                 # extra tags merged with the auto-derived ones.

data:
  shard_dir: data/fineweb_edu_2048

model:
  vocab_size: 50304            # GPT-2 BPE rounded up for fast tensor cores
  hidden: 768
  n_layers: 12
  tie_embeddings: true
  init_std: 0.02
  norm:
    type: rmsnorm              # rmsnorm | layernorm
    eps: 1.0e-6
  attn:
    n_heads: 12
    n_kv_heads: null            # null ⇒ MHA
    head_dim: null
    qk_norm: false
    rope_partial_frac: 1.0      # 0.5 ⇒ modded-nanogpt half-RoPE
    pos_emb_unused_placeholder: 0  # placeholder so the section validates
    # Phase-2 MLA fields (rung O_mla; suggestion.md S2). attn_type="mha" keeps
    # the existing CausalSelfAttention path. "mla" requires kv_lora_rank > 0
    # and positive qk_nope_head_dim / qk_rope_head_dim / v_head_dim. The
    # optional low-rank Q path is enabled when q_lora_rank > 0.
    attn_type: mha              # mha | mla
    kv_lora_rank: 0
    q_lora_rank: 0
    qk_nope_head_dim: 0
    qk_rope_head_dim: 0
    v_head_dim: 0
  pos_emb:
    type: rope                  # rope | learned
    rope_base: 10000.0
  mlp:
    type: swiglu                # swiglu | gelu_2mat | relu2 | factff
    intermediate: 0             # 0 ⇒ inferred per mlp.type
    # Phase-2 imposed-FFN-factorisation (rung P_factff / Tier B3). Only used
    # when type=="factff"; sets the bottleneck rank for the (factff_up,
    # factff_down) pair. Coupled by default via optimizer.couple_factff.
    factorize_rank: 0
  moe:
    enabled: false
    num_experts: 8
    top_k: 2
    capacity_factor: 1.25
    aux_loss_coef: 0.01
    z_loss_coef: 1.0e-3
    balancing_type: aux_loss    # aux_loss | deepseek_bias
    bias_update_lr: 1.0e-3      # DeepSeek-V2 §3.2 sign-rule step
    shared_expert: false        # DeepSeekMoE-style always-on expert (rung L)
    shared_expert_intermediate: 0  # 0 ⇒ inherit from per-expert intermediate
    every_other: true           # spec d.2: MoE replaces every OTHER dense MLP
    intermediate: 0             # 0 ⇒ inherit from mlp.intermediate. Separate
                                # control needed because M/N stress per-expert
                                # size while keeping the dense MLP fixed.

optimizer:
  type: coupled_muon_v2         # adamw | muon | coupled_muon_v2
  lr: 3.0e-3                    # for muon-family; AdamW configs override
  wd: 0.1                       # base value; with `wd_per_width: true` it is
                                # divided by hidden at apply time per d.3 +
                                # Qiu et al. 2025 (arXiv 2512.05620, "Hyperparameter
                                # Transfer Enables Consistent Gains of Matrix-
                                # Preconditioned Optimizers Across Scales") §3.4:
                                # "scaling the independent weight decay as
                                # 1/width is near-optimal across optimizers".
  wd_per_width: true            # d.3 protocol — applies to all optimizers.
  momentum: 0.95
  nesterov: true                # Moonlight 2502.16982 default. Set false
                                # for suggestion.md §B5 momentum/Nesterov
                                # confirmation cell; honored by both Muon and
                                # CoupledMuon_v2 builders.
  betas: [0.95, 0.95]           # AdamW β₁=0.95, β₂=0.95 per experiment.md d.3.
                                # Empirical default informed by the Essential AI
                                # "Practical Efficiency of Muon for Pretraining"
                                # study (arXiv 2505.02222); the paper's abstract
                                # focuses on the Muon-vs-AdamW compute frontier
                                # rather than naming β₁/β₂, so treat the cite as
                                # supportive context, not direct prescription.
  eps: 1.0e-8
  ns_steps: 5
  coupled_steps: 4              # 0 ⇒ plain Muon path inside CoupledMuon_v2
  couple_qk: true
  couple_vo: true
  couple_updown: true
  use_multi_head: true          # enable per-head reshape in coupled NS
  ns_dtype: bf16
  # Two-stage composition: True (default) is Muon(C_A(g; B)) — the operating
  # point that produced the LLaMA-60M result. False is the stage-1-only
  # ablation (experiment.md a.2 / d.4). Toggle to localize whether the trailing
  # NS pass is doing real work or is approximately a no-op.
  final_polish: true
  # Router optimizer: True (default, matches Moonlight 2502.16982 §3.4 and
  # Cerebras nanoMoE) routes MoE routers through Muon. False → AdamW (rung J
  # ablation, DeepSeek-V2/V3/OLMoE-style). See experiment.md c.3.
  couple_router_to_muon: true
  # Phase-2 NS-policy / Gram-form / LR-prefactor knobs (suggestion.md S1 / A2,
  # experiment.md d.3 Phase-2 protocol). Defaults preserve Phase-1 numerics
  # bitwise: `bernstein` ⇒ hardcoded (3.4445, -4.7750, 2.0315) triple,
  # `moonlight` ⇒ `0.2·√max(A,B)`. See optim/ns_coefficients.py for tables.
  ns_coefficients: bernstein    # bernstein | polar_express | cesista
  ns_gram_form: false           # reserved; Phase-2 framework only, kernel TBD
  lr_prefactor: moonlight       # moonlight | bernstein_ratio | cesista
  # Phase-2 factored-architecture coupling toggles. No-ops when the relevant
  # projections are absent from the model — kept here so sweep YAMLs can
  # ablate them at rungs O_mla and P_factff.
  couple_mla: true
  couple_factff: true

train:
  total_tokens: 100_000_000     # smoke default; ladder configs override
  seq_len: 2048
  local_batch_size: 8
  grad_accum_steps: 1
  warmup_steps: 100
  bf16: true
  grad_clip: 1.0
  log_every_steps: 10
  eval_every_steps: 500
  val_tokens: 1_000_000
  probes:
    svd_interval_tokens: 50_000_000
    coupled_pair_interval_tokens: 50_000_000
    attn_logit_interval_tokens: 5_000_000
    moe_load_interval_tokens: 0       # MoE-only; ladder/I_moe and smoke/I_moe override
    ns_internal_interval_tokens: 0    # diagnostic-only; per d.6.3
    # Phase-2 LoRA-RITE one-factor-dominates probe (suggestion.md §2.7). Zero
    # compute cost (two .norm() per pair). Off by default; rungs O_mla,
    # P_factff and Stage-3 production sweeps will turn it on.
    pair_factor_ratio_interval_tokens: 0
