[project]
name = "coupled-muon-nanogpt"
version = "0.1.0"
description = "Coupled Muon v2 ladder experiments on a NanoGPT-style harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned to a cu128 build for the H200 training box (driver 12.8).
    # cu128 wheels exist for torch 2.7+; we cap below the cu130-default releases
    # (torch 2.11+) so `uv sync` picks the latest cu128-compatible build.
    # Note: the 4090 dev box requires driver R570+ for cu128; if it lags,
    # bump its driver or run on the H200 box only.
    "torch>=2.7,<2.10",
    "omegaconf>=2.3",
    "tiktoken>=0.7",
    "wandb>=0.18",
    "einops>=0.8",
    "datasets>=3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Force uv to resolve `torch` against the PyTorch cu128 index instead of PyPI
# (which currently defaults to cu130 builds requiring driver R580+).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/coupled_muon_nanogpt"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]  # ambiguous var name (we use l, I, etc. as math indices)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
