[project]
name = "coupled-muon-nanogpt"
version = "0.1.0"
description = "Coupled Muon v2 ladder experiments on a NanoGPT-style harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned to a cu124 build so the same wheel works on both the 4090 dev box
    # (driver 12.4) and H200 training box (driver 12.8). Newer torch wheels
    # default to cu128/cu130 which require correspondingly newer drivers; on
    # Inspire Studio those wheels silently fall back to CPU. Hopper (sm_90)
    # is supported by cu124, so H200 runs at full speed.
    "torch>=2.5,<2.7",
    "omegaconf>=2.3",
    "tiktoken>=0.7",
    "wandb>=0.18",
    "einops>=0.8",
    "datasets>=3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Force uv to resolve `torch` against the PyTorch cu124 index instead of PyPI
# (which serves cu128/cu130 builds for newer torch versions).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["src/coupled_muon_nanogpt"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]  # ambiguous var name (we use l, I, etc. as math indices)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
